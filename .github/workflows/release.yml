# Creates draft releases on matching version tags or manual runs.
# Fork releases contain only an unsigned Windows x64 installer, no update feed.
# Upstream retains its desktop update metadata and extension archives.
name: Release

on:
  push:
    tags: ["v*"]
  # "Run workflow" button in the Actions tab — publishes whatever's on the
  # selected branch under package.json's current version, without needing a tag.
  workflow_dispatch:

# contents: write is what lets GITHUB_TOKEN create/update a release and upload
# assets to it; the repo's default token permissions are read-only, so this has
# to be declared explicitly.
permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'DaveyHert/Dishylink' || github.repository == 'ToneyStuck/Dishylink'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: resolve
        name: Resolve the tag and reject one that disagrees with package.json
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::pushed tag $GITHUB_REF_NAME does not match package.json version $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify publishing targets this repository
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          // Fail closed if the literal publish block changes shape.
          const config = fs.readFileSync('electron-builder.yml', 'utf8').replace(/\r\n/g, '\n');
          const publish = config.match(/^publish:\n((?:  .+\n)+)/m)?.[1] ?? '';
          const owner = publish.match(/^  owner: ([A-Za-z0-9_.-]+)$/m)?.[1];
          const repo = publish.match(/^  repo: ([A-Za-z0-9_.-]+)$/m)?.[1];
          const target = `${owner}/${repo}`;
          if (target.toLowerCase() !== process.env.GITHUB_REPOSITORY.toLowerCase()) {
            throw new Error(`Publish target ${target} differs from ${process.env.GITHUB_REPOSITORY}`);
          }
          if (process.env.GITHUB_REPOSITORY.toLowerCase() === 'toneystuck/dishylink') {
            const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!version.includes('-fork.')) throw new Error('Fork releases require a fork prerelease version');
          }
          NODE
      - name: Create the draft release unless it already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.resolve.outputs.tag }}"
          if [ "${GITHUB_REPOSITORY,,}" = "toneystuck/dishylink" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
              if [ "$draft" != "true" ]; then
                echo "::error::Refusing to replace assets on published fork release $tag; use a new version"
                exit 1
              fi
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease
            else
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$tag" --notes ""
            fi
          else
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "$tag" --notes ""
          fi

  release-mac:
    if: github.repository == 'DaveyHert/Dishylink'
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Both mac archs in one invocation: electron-builder writes a single
      # latest-mac.yml covering arm64 and x64. Two separate jobs would each
      # overwrite the other's yml on the release and strand one arch.
      - run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-win:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: github.repository == 'DaveyHert/Dishylink'
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.repository == 'ToneyStuck/Dishylink'
        name: Package unsigned fork preview without publishing metadata
        run: npm run pack:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: github.repository == 'ToneyStuck/Dishylink'
        name: Attach installer only to draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Fork release must still be a draft' }
          $installers = @(Get-ChildItem release/*-x64.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Windows x64 installer' }
          gh release upload $env:RELEASE_TAG $installers[0].FullName --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed' }

  release-extension:
    if: github.repository == 'DaveyHert/Dishylink'
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run zip:extension
      - run: npm run zip:extension:firefox
      - run: npm run zip:extension:edge
      - name: Attach the store archives to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" .output/dishylink-*.zip \
            --clobber --repo "$GITHUB_REPOSITORY"
